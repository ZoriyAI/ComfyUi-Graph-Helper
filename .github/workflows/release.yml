name: Build and package

# The long run: every end-to-end test, the screen walks, and the Linux packages (.deb, .rpm, AppImage, tar.gz with
# install.sh), each installed or unpacked and started. Runs for a version tag, by hand, and once a week; never for
# pull requests (ci.yml has the fast checks for those). A tag, or a manual run with a tag, then publishes a release
# with checksums, a build provenance attestation and a component list (SBOM).
#
# Linux x64 only: the app is built and tested for Linux. Windows and macOS are not built here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.0.0); leave empty for a plain build'
        required: false
        default: ''
  schedule:
    # Sunday 03:17 UTC; skipped when nothing was committed in the last week.
    - cron: '17 3 * * 0'

# A newer run of the same ref waits; a release run is never cancelled.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Empty for a plain build; the tag for a release.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
  # The AppImage runtime (https://github.com/AppImage/type2-runtime). Its SHA-256 is checked when the repository
  # variable APPIMAGE_RUNTIME_SHA256 is set (Settings > Secrets and variables > Actions > Variables).
  APPIMAGE_RUNTIME_TAG: '20251108'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 50

      # A release fails here, in a minute, rather than after the long run.
      - name: Release tag, version and notes agree
        if: env.RELEASE_TAG != ''
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi
          if [ ! -f "docs/releases/$RELEASE_TAG.md" ]; then
            echo "::error::docs/releases/$RELEASE_TAG.md is missing: the release notes come from it"
            exit 1
          fi

      - name: CHANGELOG.md is up to date
        run: node scripts/changelog.js --check

      - name: Nothing private in the tree
        run: node scripts/public-tree-check.js

      # The weekly run spends runner minutes only when the week brought commits.
      - name: Anything new this week
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -z "$(git log --since='8 days ago' --format=%H -1)" ]; then
            echo "No commits in the last week: the weekly run stops here."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: End-to-end tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System packages for Electron under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1
      - run: npm ci
      - run: npm run build
      # The unpackaged build has no fuses: Playwright attaches through the inspector here, never to a release binary.
      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npx playwright test --trace off --grep-invert "live-local|layout-walk" --retries=1
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  walks:
    name: Screen walk (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every size, Russian
            out: test-results/layout-ru
          - name: two sizes, English
            lang: en
            sizes: 800x560,1400x860
            out: test-results/layout-en
          # A person's desktop draws text a little wider than this machine and often at a screen scale above 100 %.
          - name: wider text at 125 %, Russian
            text: wide
            dpr: '1.25'
            sizes: 800x560,1400x860
            out: test-results/layout-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System packages for Electron under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1
      - run: npm ci
      - run: npm run build
      # On its own runner: the walk opens menus and lists for minutes, and a second window taking the focus closes them.
      # An empty LAYOUT_* value means the walk's default.
      - name: Walk
        env:
          LAYOUT_LANG: ${{ matrix.lang }}
          LAYOUT_SIZES: ${{ matrix.sizes }}
          LAYOUT_TEXT: ${{ matrix.text }}
          LAYOUT_DPR: ${{ matrix.dpr }}
          LAYOUT_OUT: ${{ matrix.out }}
        run: xvfb-run -a npx playwright test tests/e2e/layout-walk.test.ts --trace off --retries=1
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-results-${{ strategy.job-index }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Linux packages
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: System packages for Electron, Xvfb, the makers and the package checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm cpio squashfs-tools xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1 desktop-file-utils lintian shellcheck

      - name: AppImage runtime
        env:
          APPIMAGE_RUNTIME_SHA256: ${{ vars.APPIMAGE_RUNTIME_SHA256 }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_TAG/runtime-x86_64"
          sha256sum "$RUNNER_TEMP/runtime-x86_64"
          if [ -n "$APPIMAGE_RUNTIME_SHA256" ]; then
            echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
          else
            echo "::notice::APPIMAGE_RUNTIME_SHA256 is not set: the runtime above is used without a pinned checksum"
          fi
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/runtime-x86_64" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build
      - run: node scripts/assert-current-main.js

      - name: Make .deb, .rpm, tar.gz and AppImage
        env:
          REQUIRE_APPIMAGE: '1'
        run: |
          mkdir -p test-results
          npm run make:linux 2>&1 | tee test-results/make.log

      # Each package started as it ships: the fuses in each binary (inspector, RUN_AS_NODE and NODE_OPTIONS off),
      # the window, the tar.gz's run.sh, install.sh and uninstall.sh, the AppImage's AppRun.
      - name: Smoke-test every format
        env:
          SMOKE_REQUIRE_RPM: '1'
          SMOKE_REQUIRE_APPIMAGE: '1'
        run: xvfb-run -a npm run smoke:linux 2>&1 | tee test-results/smoke.log

      - name: Desktop entries are valid
        run: |
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x out/make/deb/x64/*.deb "$RUNNER_TEMP/deb"
          desktop-file-validate "$RUNNER_TEMP/deb/usr/share/applications/comfyui-graph-builder.desktop"
          mkdir -p "$RUNNER_TEMP/rpm"
          (cd "$RUNNER_TEMP/rpm" && rpm2cpio "$GITHUB_WORKSPACE"/out/make/rpm/x64/*.rpm | cpio -idm --quiet)
          desktop-file-validate "$RUNNER_TEMP/rpm/usr/share/applications/comfyui-graph-builder.desktop"

      - name: Shell scripts
        run: shellcheck -s sh resources/linux/portable/*.sh resources/linux/postinst resources/linux/postrm

      # Errors fail the build; warnings and info are reported. What every Electron bundle triggers is overridden,
      # with the reason, in forge.config.js (lintianOverrides).
      - name: Lintian
        run: lintian --info --display-info --fail-on error out/make/deb/x64/*.deb 2>&1 | tee test-results/lintian.txt

      # The newest published release before this one, if there is any: a new repository or a fork has none, and
      # then the step says so and passes.
      - name: Upgrade from the previous release keeps settings and the graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 30 --json tagName --jq '.[].tagName' \
            | grep -vx "${RELEASE_TAG:-none}" | head -n 1 || true)
          if [ -z "$previous" ]; then
            echo "::notice::No earlier release in $GITHUB_REPOSITORY: the upgrade test is skipped."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/previous"
          if ! gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir "$RUNNER_TEMP/previous"; then
            echo "::notice::Release $previous has no .deb: the upgrade test is skipped."
            exit 0
          fi
          echo "Upgrading from $previous"
          sudo apt-get install -y "$RUNNER_TEMP"/previous/*.deb
          export SMOKE_HOME="$RUNNER_TEMP/upgrade-home"
          xvfb-run -a node scripts/smoke-installed-package.js upgrade-prepare
          # dpkg -i, not apt: apt skips a package whose version is already installed.
          sudo dpkg -i out/make/deb/x64/*.deb
          sudo apt-get install -f -y
          xvfb-run -a node scripts/smoke-installed-package.js upgrade-verify

      - name: The installed .deb (package fields, profile path, window class, --version, one instance)
        run: |
          sudo apt-get install -y ./out/make/deb/x64/*.deb
          xvfb-run -a node scripts/smoke-installed-package.js check

      - name: Release files, checksums and the component list
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          cp out/make/deb/x64/*.deb out/make/rpm/x64/*.rpm out/make/portable/*.AppImage out/make/portable/*.tar.gz release/
          node scripts/make-sbom.js "release/comfyui-graph-builder-$version.cdx.json"
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: release/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_TAG != '' && 90 || 14 }}

      - name: Upload test and package results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-results
          path: |
            test-results
            out/make
          if-no-files-found: ignore
          retention-days: 14

  rpm:
    name: The .rpm installed on Fedora
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: fedora:latest
    steps:
      - name: Tools for checkout, Node and Xvfb
        run: dnf install -y --setopt=install_weak_deps=False git tar gzip xz which procps-ng xorg-x11-server-Xvfb xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only the test driver (Playwright) is needed: no Electron download, no native builds.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release
      - name: Install the .rpm with its dependencies
        run: dnf install -y ./release/*.rpm
      - name: The installed .rpm (package fields, profile path, window class, --version, one instance)
        env:
          SMOKE_PACKAGE: rpm
        run: xvfb-run -a node scripts/smoke-installed-package.js check

  release:
    name: Release
    needs: [plan, e2e, walks, package, rpm]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Settings > Environments > release: add required reviewers there to approve each release by hand.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release

      - name: Checksums still match
        run: cd release && sha256sum -c SHA256SUMS

      # Anyone can check where a file was built: gh attestation verify <file> --repo <owner>/<repository>
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.tar.gz
            release/*.cdx.json
            release/SHA256SUMS

      # The gh tool on the runner, not a third-party action, holds the write token.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Graph Helper for ComfyUI $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
