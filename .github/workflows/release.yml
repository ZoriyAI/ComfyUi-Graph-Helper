name: Build and package

# The long run: every end-to-end test, the screen walks, and the Linux packages (.deb, .rpm, AppImage, tar.gz with
# install.sh), each installed or unpacked and started. Runs for main, a version tag, by hand, and once a week; never for
# pull requests (ci.yml has the fast checks for those). A new main version, tag, or manual release then publishes
# with checksums, a build provenance attestation and a component list (SBOM).
#
# Linux x64 packages only. Windows and macOS have no packages: each release carries install-windows.ps1 and
# install-macos.sh, which build the app from the release's source on the person's computer; install-scripts.yml proves
# them on GitHub's Windows and macOS runners.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.0.0); leave empty for a plain build'
        required: false
        default: ''
  schedule:
    # Sunday 03:17 UTC; skipped when nothing was committed in the last week.
    - cron: '17 3 * * 0'

# Active runs are not cancelled; GitHub may replace an older pending run for the same ref.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      publish: ${{ steps.plan.outputs.publish }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 50

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      - name: CHANGELOG.md is up to date
        run: node scripts/changelog.js --check

      - name: Nothing private in the tree
        run: node scripts/public-tree-check.js

      - name: Plan exact release source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release_tag }}
        run: node scripts/release-plan.js plan

  checks:
    name: Types, lint and unit tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  installers:
    name: Install scripts at the release source
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/install-scripts.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  e2e:
    name: End-to-end tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System packages for Electron under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1
      - run: npm ci
      - run: npm run build
      - name: Chromium for the paired browser journeys
        run: npx playwright install --with-deps chromium
      - name: Prepare Electron before starting fixture servers
        timeout-minutes: 5
        run: node -p "require('electron')"
      # The unpackaged build has no fuses: Playwright attaches through the inspector here, never to a release binary.
      # Native Electron windows share this X display: parallel workers steal each other's keyboard/menu focus.
      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npx playwright test --trace off --grep-invert "live-local|layout-walk" --workers=1 --retries=1
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  walks:
    name: Screen walk (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each window size gets its own runner: preserve every screen while reducing release latency.
          - name: 800x560, Russian
            sizes: 800x560
            out: test-results/layout-ru-small
          - name: 1024x700, Russian
            sizes: 1024x700
            out: test-results/layout-ru-laptop
          - name: 1280x800, Russian
            sizes: 1280x800
            out: test-results/layout-ru-medium
          - name: 1400x860, Russian
            sizes: 1400x860
            out: test-results/layout-ru-default
          - name: 1920x1080, Russian
            sizes: 1920x1080
            out: test-results/layout-ru-large
          - name: 800x560, English
            lang: en
            sizes: 800x560
            out: test-results/layout-en-small
          - name: 1400x860, English
            lang: en
            sizes: 1400x860
            out: test-results/layout-en-default
          # A person's desktop draws text a little wider than this machine and often at a screen scale above 100 %.
          - name: wider text at 125 %, 800x560, Russian
            text: wide
            dpr: '1.25'
            sizes: 800x560
            out: test-results/layout-desktop-small
          - name: wider text at 125 %, 1400x860, Russian
            text: wide
            dpr: '1.25'
            sizes: 1400x860
            out: test-results/layout-desktop-default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System packages for Electron under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1
      - run: npm ci
      - run: npm run build
      - name: Prepare Electron before starting fixture servers
        timeout-minutes: 5
        run: node -p "require('electron')"
      # On its own runner: the walk opens menus and lists for minutes, and a second window taking the focus closes them.
      # An empty LAYOUT_* value means the walk's default.
      - name: Walk
        env:
          LAYOUT_LANG: ${{ matrix.lang }}
          LAYOUT_SIZES: ${{ matrix.sizes }}
          LAYOUT_TEXT: ${{ matrix.text }}
          LAYOUT_DPR: ${{ matrix.dpr }}
          LAYOUT_OUT: ${{ matrix.out }}
        # Layout faults are deterministic; report the first full walk instead of repeating every screen.
        run: xvfb-run -a npx playwright test tests/e2e/layout-walk.test.ts --trace off --retries=0
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-results-${{ strategy.job-index }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Linux packages
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: System packages for Electron, Xvfb, the makers and the package checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm cpio squashfs-tools xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1 desktop-file-utils lintian shellcheck

      - run: npm ci
      - name: Pin AppImage runtime
        id: runtime
        env:
          RUNTIME_TAG: ${{ vars.APPIMAGE_RUNTIME_TAG }}
          RUNTIME_SHA256: ${{ vars.APPIMAGE_RUNTIME_SHA256 }}
        run: node scripts/release-plan.js runtime
      - name: AppImage runtime
        env:
          APPIMAGE_RUNTIME_TAG: ${{ steps.runtime.outputs.tag }}
          APPIMAGE_RUNTIME_SHA256: ${{ steps.runtime.outputs.sha256 }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_TAG/runtime-x86_64"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/runtime-x86_64" >> "$GITHUB_ENV"

      - run: npm run build
      - run: node scripts/assert-current-main.js

      - name: Make .deb, .rpm, tar.gz and AppImage
        env:
          REQUIRE_APPIMAGE: '1'
        run: |
          mkdir -p test-results
          npm run make:linux 2>&1 | tee test-results/make.log

      # Each package started as it ships: the fuses in each binary (inspector, RUN_AS_NODE and NODE_OPTIONS off),
      # the window, the tar.gz's run.sh, install.sh and uninstall.sh, the AppImage's AppRun.
      - name: Smoke-test every format
        env:
          SMOKE_REQUIRE_RPM: '1'
          SMOKE_REQUIRE_APPIMAGE: '1'
        run: xvfb-run -a npm run smoke:linux 2>&1 | tee test-results/smoke.log

      - name: Desktop entries are valid
        run: |
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x out/make/deb/x64/*.deb "$RUNNER_TEMP/deb"
          desktop-file-validate "$RUNNER_TEMP/deb/usr/share/applications/nodewise-studio.desktop"
          mkdir -p "$RUNNER_TEMP/rpm"
          (cd "$RUNNER_TEMP/rpm" && rpm2cpio "$GITHUB_WORKSPACE"/out/make/rpm/x64/*.rpm | cpio -idm --quiet)
          desktop-file-validate "$RUNNER_TEMP/rpm/usr/share/applications/nodewise-studio.desktop"

      - name: Shell scripts
        run: |
          shellcheck -s sh resources/linux/portable/*.sh resources/linux/postinst resources/linux/postrm
          shellcheck -s bash scripts/install/install-macos.sh

      # Errors fail the build; warnings and info are reported. What every Electron bundle triggers is overridden,
      # with the reason, in forge.config.js (lintianOverrides).
      - name: Lintian
        run: lintian --info --display-info --fail-on error out/make/deb/x64/*.deb 2>&1 | tee test-results/lintian.txt

      # Only successful release/asset reads proving absence may skip the upgrade gate.
      - name: Download the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.js previous
      # The previous release (0.9.0) was packaged under the app's old name. The new .deb replaces that package
      # (Replaces and Conflicts, forge.config.js), so dpkg removes it while installing the new one; the app then
      # takes over the old profile folder on its first start (src/main/profileAdoption.ts). upgrade-verify checks both.
      - name: Upgrade from the previous release keeps settings and the graph
        if: steps.previous.outputs.tag != ''
        run: |
          sudo apt-get install -y "$RUNNER_TEMP"/previous/*.deb
          export SMOKE_HOME="$RUNNER_TEMP/upgrade-home"
          xvfb-run -a node scripts/smoke-installed-package.js upgrade-prepare
          # dpkg -i, not apt: apt skips a package whose version is already installed.
          sudo dpkg -i out/make/deb/x64/*.deb
          sudo apt-get install -f -y
          xvfb-run -a node scripts/smoke-installed-package.js upgrade-verify

      - name: The installed .deb (package fields, profile path, window class, --version, one instance)
        run: |
          sudo apt-get install -y ./out/make/deb/x64/*.deb
          xvfb-run -a node scripts/smoke-installed-package.js check

      - name: Release files, checksums and the component list
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          cp out/make/deb/x64/*.deb out/make/rpm/x64/*.rpm out/make/portable/*.AppImage out/make/portable/*.tar.gz release/
          # The install scripts for Windows and macOS, which build the app from this tag's source on those systems
          # (.github/workflows/install-scripts.yml proves them on GitHub's Windows and macOS runners).
          cp scripts/install/install-windows.ps1 scripts/install/install-macos.sh release/
          node scripts/make-sbom.js "release/nodewise-studio-$version.cdx.json"
          cp dist/product-manifest.json "release/nodewise-product-$version.json"
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: release/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_TAG != '' && 90 || 14 }}

      - name: Upload test and package results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-results
          path: |
            test-results
            out/make
          if-no-files-found: ignore
          retention-days: 14

  rpm:
    name: The .rpm installed on Fedora
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: fedora:latest
    steps:
      - name: Tools for checkout, Node and Xvfb
        run: dnf install -y --setopt=install_weak_deps=False git tar gzip xz which procps-ng xorg-x11-server-Xvfb xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only the test driver (Playwright) is needed: no Electron download, no native builds.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release
      - name: Install the .rpm with its dependencies
        run: dnf install -y ./release/*.rpm
      - name: The installed .rpm (package fields, profile path, window class, --version, one instance)
        env:
          SMOKE_PACKAGE: rpm
        run: xvfb-run -a node scripts/smoke-installed-package.js check

  release:
    name: Release
    needs: [plan, checks, installers, e2e, walks, package, rpm]
    if: needs.plan.outputs.publish == 'true'
    concurrency:
      group: release-${{ needs.plan.outputs.release_tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_INPUT: ${{ inputs.release_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Settings > Environments > release: add required reviewers there to approve each release by hand.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recheck under the version lock
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.js recheck

      - if: steps.recheck.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release

      - name: Checksums still match
        if: steps.recheck.outputs.publish == 'true'
        run: cd release && sha256sum -c SHA256SUMS

      # Anyone can check where a file was built: gh attestation verify <file> --repo <owner>/<repository>
      - name: Build provenance
        if: steps.recheck.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.tar.gz
            release/*.cdx.json
            release/nodewise-product-*.json
            release/install-windows.ps1
            release/install-macos.sh
            release/SHA256SUMS

      # The gh tool on the runner, not a third-party action, holds the write token.
      - name: Publish
        if: steps.recheck.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.js publish
