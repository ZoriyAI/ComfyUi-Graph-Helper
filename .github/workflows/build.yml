name: Build and package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v0.2.0); leave empty for a plain build'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (tests, e2e, .deb)
    runs-on: ubuntu-latest
    # The three walks visit every step of every lesson at every size: over an hour together with the rest.
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System packages for Electron, Xvfb and the deb maker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1

      - name: Install
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npx playwright test --trace off --grep-invert "live-local|layout-walk" --retries=1

      # On its own: the walk opens menus and lists for minutes, and a second window taking the focus closes them.
      - name: Every screen at every window size, Russian
        run: LAYOUT_OUT=test-results/layout-ru xvfb-run -a npx playwright test tests/e2e/layout-walk.test.ts --trace off --retries=1

      - name: Every screen in the smallest and the usual window, English
        run: LAYOUT_LANG=en LAYOUT_SIZES=800x560,1400x860 LAYOUT_OUT=test-results/layout-en xvfb-run -a npx playwright test tests/e2e/layout-walk.test.ts --trace off --retries=1

      # A person's desktop draws text a little wider than this machine and often at a screen scale above 100 %.
      - name: Every screen with wider text at a screen scale of 125 %, Russian
        run: LAYOUT_TEXT=wide LAYOUT_DPR=1.25 LAYOUT_SIZES=800x560,1400x860 LAYOUT_OUT=test-results/layout-desktop xvfb-run -a npx playwright test tests/e2e/layout-walk.test.ts --trace off --retries=1

      - name: Package .deb and smoke-test it
        run: xvfb-run -a npm run package:linux

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-graph-helper-deb
          path: out/make/deb/x64/*.deb
          if-no-files-found: error

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore

      - name: Release on tag or on request
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ComfyUI Graph Helper ${{ inputs.release_tag || github.ref_name }}
          files: out/make/deb/x64/*.deb
          body_path: docs/releases/${{ inputs.release_tag || github.ref_name }}.md
          generate_release_notes: true
