name: Checks

# Fast checks for every pull request and every push to the default branch: types, unit and integration tests, the
# build. A few minutes on one Linux runner. The long end-to-end run, the screen walks and the packages are in
# release.yml (tags, by hand, weekly).
#
# Pull requests from forks run here with a read-only token and no secrets: this workflow names none, and
# `pull_request` (never `pull_request_target`) gives a fork's code nothing to reach.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: CHANGELOG.md is up to date
        run: node scripts/changelog.js --check

      # Nothing that must stay private in the tracked files (mailboxes, session links, home paths, keys).
      - name: Nothing private in the tree
        run: node scripts/public-tree-check.js

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  editor-journeys:
    name: Editor journeys (Ubuntu / Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1
      - run: npm ci
      - run: npm run build
      - name: Editor, file, privacy, check and lesson journeys
        run: |
          xvfb-run -a npx playwright test tests/e2e/editor-selection.test.ts tests/e2e/subgraph-inner-authoring.test.ts tests/e2e/privacy-confirm.test.ts tests/e2e/canvas-editing.test.ts tests/e2e/files-and-check.test.ts tests/e2e/canvas-explain.test.ts tests/e2e/component-records.test.ts tests/e2e/desktop-captures.test.ts tests/e2e/import-look.test.ts tests/e2e/node-card.test.ts tests/e2e/prerelease-journey.test.ts tests/e2e/project-explanations.test.ts --workers=1 --trace off
      - name: Core lesson list and compatibility journeys
        run: |
          xvfb-run -a npx playwright test tests/e2e/lessons.test.ts --grep 'lessons: the list fits ComfyUI|lessons: a lesson that does not fit|lessons: descriptions, a second pass' --workers=1 --trace off
      - name: Upload journey results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-journey-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
