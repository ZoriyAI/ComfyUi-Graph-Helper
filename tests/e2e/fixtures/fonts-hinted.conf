<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts the way most Linux desktops draw them: antialiased, fully hinted. With hinting every letter is as wide as a
  whole number of pixels, so a label is one to two percent wider than without it (a test machine without a desktop
  has no hinting). A layout that fits to the pixel there does not fit here. layout-walk.test.ts uses this file
  with LAYOUT_FONTS=hinted.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
</fontconfig>
